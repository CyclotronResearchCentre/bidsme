# --------------------------------------------------------------------------------
# This is a bidsmap YAML file with the key-value mappings for the different BIDS
# modalities (anat, func, dwi, etc). The modality attributes are the keys that map
# onto the BIDS labels. The bidsmap data-structure should be 5 levels deep:
# dict > dict > list > dict > dict
#
# NB:
# 1) Edit the bidsmap file to your needs before feeding it to bidscoiner.py
# 2) (Institute) users may create their own bidsmap_[template].yaml or
#    bidsmap_[sample].yaml file
#
# For more information, see:
# https://github.com/Donders-Institute/bidscoin
# https://docs.ansible.com/ansible/latest/reference_appendices/YAMLSyntax.html
# --------------------------------------------------------------------------------


__bids__: '1.10.0'

__templates__: {}

MRI:
  hmriNIFTI:
    __ignore__:
      - provenance: ~
        model: __unknown__
        suffix: ""
        attributes:
          ProtocolName:
            - 'localizer'
            - "AAHead_Scout.*"
            - "Auto-Aligned Localizer"
            - "B0_Shimming_.*"
            - "calc_shims_.*"
        bids: {}
        json: {}

    anat:
      - provenance: ~ # T1w 
        model: anat:T1w
        suffix: T1w
        attributes:
          ProtocolName: ["t1_mpr_.*", "t1_mprage_.*"]
        bids: !!omap []
        json: {}

      - provenance: ~ # T2w 
        model: anat:T2w
        suffix: T2w
        attributes:
          ProtocolName: ["t2_cor_p2_.*", "T2_*"]
        bids: !!omap []
        json: {}

      - provenance: ~ # Flair (T2)
        model: anat:FLAIR
        suffix: FLAIR
        attributes:
          ProtocolName: ['t2_spc_da-fl_.*', 't2_space_FLAIR_.*', 't2_flair_.*', '.*T2 flair.*']
        bids: !!omap []
        json: {}

      - provenance: ~ # MP2RAGE
        model: anat:MP2RAGE
        suffix: MP2RAGE
        attributes:
          ProtocolName: ".*_mp2rage.*"
          SeriesDescription: ".*_INV.*"
        bids: !!omap 
          - inv: <<placeholder>>
        json: !!omap
          - NumberShots: <ReconMatrixPE>

      - provenance: ~ # MP2RAGE
        model: anat:UNIT1
        suffix: UNIT1
        attributes:
          ProtocolName: ".*_mp2rage.*"
          SeriesDescription: ".*_UNI_Images.*"
        bids: !!omap []
        json: !!omap
          - NumberShots: <ReconMatrixPE>

      - provenance: ~ # MPM anatomical images
        suffix: MPM
        attributes: 
          ProtocolName: ["al_mtflash3d_(?!sens).*"]
          ImageType: 'ORIGINAL\\PRIMARY\\M\\ND'
        model: anat:MPM
        bids: !!omap
          - echo: <EchoNumbers>
          - part: mag
        json:
          EchoTimeSeries: <round10:scale-6:CSASeriesHeaderInfo/MrPhoenixProtocol/alTE>
      - provenance: ~ # MPM anatomical images
        suffix: MPM
        attributes: 
          ProtocolName: ["al_mtflash3d_(?!sens).*"]
          ImageType: 'ORIGINAL\\PRIMARY\\P\\ND'
        model: anat:MPM
        bids: !!omap
          - echo: <EchoNumbers>
          - part: phase
        json:
          EchoTimeSeries: <round10:scale-6:CSASeriesHeaderInfo/MrPhoenixProtocol/alTE>
      - provenance: ~
        suffix: MPM
        attributes: 
          ProtocolName: ["t1w_mfc_3dflash_.*", "t1w_kp_mtflash3d_.*"]
          ImageType: 'ORIGINAL\\PRIMARY\\M\\ND'
        model: anat:MPM
        bids: !!omap
          - acq: T1w
          - echo: <EchoNumbers>
          - flip: '1'
          - mt: off
          - part: mag
        json:
          MTState: false
      - provenance: ~
        suffix: MPM
        attributes: 
          ProtocolName: ["t1w_mfc_3dflash_.*", "t1w_kp_mtflash3d_.*"]
          ImageType: 'ORIGINAL\\PRIMARY\\P\\ND'
        model: anat:MPM
        bids: !!omap
          - acq: T1w
          - echo: <EchoNumbers>
          - flip: '1'
          - mt: off
          - part: phase
        json:
          MTState: false
      - provenance: ~
        suffix: MPM
        attributes: 
          ProtocolName: ["pdw_mfc_3dflash_.*", "pdw_kp_mtflash3d_.*"]
          ImageType: 'ORIGINAL\\PRIMARY\\M\\ND'
        model: anat:MPM
        bids: !!omap
          - acq: PDw
          - echo: <EchoNumbers>
          - flip: '2'
          - mt: off
          - part: mag
        json:
          MTState: false
      - provenance: ~
        suffix: MPM
        attributes: 
          ProtocolName: ["pdw_mfc_3dflash_.*", "pdw_kp_mtflash3d_.*"]
          ImageType: 'ORIGINAL\\PRIMARY\\P\\ND'
        model: anat:MPM
        bids: !!omap
          - acq: PDw
          - echo: <EchoNumbers>
          - flip: '2'
          - mt: off
          - part: phase
        json:
          MTState: false
      - provenance: ~
        suffix: MPM
        attributes: 
          ProtocolName: ["mtw_mfc_3dflash_.*", "mtw_kp_mtflash3d_.*"]
          ImageType: 'ORIGINAL\\PRIMARY\\M\\ND'
        model: anat:MPM
        bids: !!omap
          - acq: MTw
          - echo: <EchoNumbers>
          - flip: '2'
          - mt: on
          - part: mag
        json:
          MTState: true
      - provenance: ~
        suffix: MPM
        attributes: 
          ProtocolName: ["mtw_mfc_3dflash_.*", "mtw_kp_mtflash3d_.*"]
          ImageType: 'ORIGINAL\\PRIMARY\\P\\ND'
        model: anat:MPM
        bids: !!omap
          - acq: MTw
          - echo: <EchoNumbers>
          - flip: '2'
          - mt: on
          - part: phase
        json:
          MTState: true

    fmap:
      - provenance: ~  # standard magnitude map
        model: fmap:magnitude1
        suffix: magnitude<EchoNumbers>
        attributes:
          ProtocolName: 'gre_field_mapping.*'
          ImageType: 'ORIGINAL\\PRIMARY\\M\\ND'
        bids: !!omap []
        json: {}

      - provenance: ~  # standard phase difference map
        suffix: phasediff
        attributes:
          ProtocolName: 'gre_field_mapping.*'
          ImageType: 'ORIGINAL\\PRIMARY\\P\\ND'
        bids: !!omap []
        json:
          EchoTime: ~
          EchoTime1: '<round10:scale-6:CSASeriesHeaderInfo/MrPhoenixProtocol/alTE/0>'
          EchoTime2: '<round10:scale-6:CSASeriesHeaderInfo/MrPhoenixProtocol/alTE/1>'

      - provenance: ~ # top-up diffusion with inverted encoding direction
        model: fmap:epi
        suffix: epi
        attributes:
          ProtocolName: [".*invertpe.*", ".*invertpa.*"]
        bids: !!omap
         - dir: PA
        json: {}
      - provenance: ~ # top-up diffusion without RF pulse
        model: fmap:epi
        suffix: epi
        attributes:
          ProtocolName: ".*noise.*"
        bids: !!omap
          - acq: noRF
          - dir: AP
        json: {}

      - provenance: ~ # sensArray map for MPM
        suffix: RB1COR
        attributes:
          ProtocolName: ['al_mtflash3d_sens.*', 'mfc_3dflash_r1k_smap.*']
        model: fmap:RB1COR
        bids: !!omap
          - acq: head<<placeholder>>
        json: {}
      - provenance: ~ # sensBody/Array map for MPM
        suffix: RB1COR
        attributes:
          ProtocolName: ['al_mtflash3d_body.*']
        model: fmap:RB1COR
        bids: !!omap
          - acq: body<<placeholder>>
        json: {}
      - provenance: ~ # B1 map for MPM
        suffix: TB1EPI
        attributes:
          ProtocolName: ['al_B1mapping.*', 'mfc_seste_b1map_.*']
        model: fmap:TB1EPI
        bids: !!omap
          - echo: <EchoNumbers>
          - flip: <<placeholder>>
        json:
          EchoTimeSeries: <round10:scale-6:CSASeriesHeaderInfo/MrPhoenixProtocol/alTE>
          FlipAngleSeries: <<placeholder>>

      - provenance: ~ # B1 map for MPM
        suffix: TB1TFL
        attributes:
          ProtocolName: ['b1map_sag_p2']
        model: fmap:TB1EPI
        bids: !!omap []
        json: {}
      - provenance: ~ # B1 map for MPM
        suffix: TB1AFI
        attributes:
          ProtocolName: ['kp_afib1_.*']
        model: fmap:TB1AFI
        bids: !!omap []
        json: {}

    func:
      - provenance: ~ # standard functional MRI
        suffix: bold
        attributes: 
          ProtocolName: ["cmrr_mbep2d_bold_mb2_.*", "cmrr_mbep2d_p3_mb2_.*", "ep2d_bold_.*"]
        bids: !!omap []
        json: {}

    dwi:
      - provenance: ~ # NODDI
        template: dwi:dwi
        suffix: dwi
        attributes: 
          ProtocolName: ["cmrr_mbep2d_diff_NODDI", "ep2d_diff_mddw_.*", "cmrr_noddi.*"]
        bids: !!omap []
        json: {}

    perf:
      - provenance: ~ # NODDI
        template: perf:asl
        suffix: asl
        attributes: 
          ProtocolName: ["pcasl_.*"]
        bids: !!omap []
        json: !!omap
          - ArterialSpinLabelingType: PCASL

EEG:
  BrainVision:
    eeg:
      - provenance: ~
        suffix: "eeg"
        attributes: {}
        bids: !!omap
          - task: "<<placeholder>>"
          - acq: ~
          - run: ~
        json: !!omap
          - TaskName: "<<bids:task>>"
          - SamplingFrequency: "<SamplingFrequency>"

